[build]
  publish = "."

[[plugins]]
  package = "netlify-plugin-minify-html"

  [plugins.inputs]
    minifierOptions = { collapseWhitespace = true, removeComments = true, minifyCSS = true, minifyJS = true }

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
