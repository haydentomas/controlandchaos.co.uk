<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control &amp; Chaos | Hub Admin Panel</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">

  <style>
    /* =========================================================
       CONTROL & CHAOS — BESPOKE LUXURY ADMIN THEME
       ========================================================= */
    :root {
      --gold: #d4af37;
      --gold-bright: #ffd700;
      --gold-muted: #bfa15f;
      --gold-glow: rgba(212, 175, 55, 0.35);
      --bg-dark: #09090d;
      --bg-card: #121218;
      --border-gold: rgba(212, 175, 55, 0.25);
    }

    body {
      margin: 0;
      background-color: var(--bg-dark) !important;
      font-family: 'Outfit', -apple-system, sans-serif !important;
      color: #eaeaf0;
    }

    /* Top Global Header Bar */
    header[class*="AppHeader"],
    header[class*="StyledHeader"] {
      background: linear-gradient(180deg, #14141d 0%, #0c0c12 100%) !important;
      border-bottom: 1px solid var(--border-gold) !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6) !important;
    }

    /* Left Sidebar Navigation */
    aside[class*="SidebarContainer"],
    nav[class*="SidebarNav"] {
      background: #0d0d14 !important;
      border-right: 1px solid rgba(255, 255, 255, 0.06) !important;
    }

    /* Collection Links in Sidebar */
    a[class*="SidebarNavLink"] {
      color: #a0a0b8 !important;
      font-weight: 500 !important;
      border-radius: 8px !important;
      transition: all 0.2s ease !important;
    }
    a[class*="SidebarNavLink"]:hover,
    a[class*="SidebarNavLink"][class*="active"] {
      background: rgba(212, 175, 55, 0.12) !important;
      color: var(--gold-bright) !important;
      border-left: 3px solid var(--gold) !important;
    }

    /* Editor Cards & Accordions */
    div[class*="EditorContainer"],
    div[class*="CardContainer"] {
      background: transparent !important;
    }

    /* Form Fields & Controls */
    input[type="text"],
    input[type="number"],
    textarea,
    select {
      background: #15151f !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: #f0f0f5 !important;
      border-radius: 8px !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-size: 14px !important;
      transition: border-color 0.2s, box-shadow 0.2s !important;
    }
    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--gold) !important;
      box-shadow: 0 0 0 3px var(--gold-glow) !important;
      outline: none !important;
    }

    /* Decap CMS Image Upload / Media Controls Styling */
    div[class*="FileWidgetButton"],
    div[class*="ImageWrapper"],
    div[class*="ControlContainer"],
    div[class*="WidgetContainer"] {
      background: #111018 !important;
      border-color: rgba(212, 175, 55, 0.2) !important;
      color: #eaeaf0 !important;
    }

    div[class*="ImageWrapper"] {
      border: 1px solid rgba(212, 175, 55, 0.25) !important;
      border-radius: 10px !important;
      overflow: hidden !important;
      padding: 12px !important;
    }

    /* Luxury Buttons */
    button[class*="StyledButton"],
    button[class*="PublishButton"],
    button[class*="SaveButton"] {
      background: linear-gradient(135deg, #d4af37 0%, #a88424 100%) !important;
      color: #0b0b0f !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.5px !important;
      border-radius: 8px !important;
      border: none !important;
      box-shadow: 0 4px 15px var(--gold-glow) !important;
      transition: transform 0.2s, box-shadow 0.2s !important;
    }
    button[class*="StyledButton"]:hover,
    button[class*="PublishButton"]:hover {
      transform: translateY(-1px) !important;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5) !important;
    }

    /* Nested List Items / Accordions in Editor */
    div[class*="ListControlItem"] {
      background: #14141e !important;
      border: 1px solid rgba(212, 175, 55, 0.15) !important;
      border-radius: 10px !important;
      margin-bottom: 12px !important;
    }
  </style>

  <!-- Explicit Decap Config Links with Cache Busting -->
  <link rel="cms-config-url" type="text/yaml" href="config.yml?v=20261001_hw">
  <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml?v=20261001_hw">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Ensure CMS always loads the latest config without browser cache
    document.addEventListener('DOMContentLoaded', () => {
      const links = document.querySelectorAll('link[rel="cms-config-url"]');
      links.forEach(l => {
        const u = l.getAttribute('href').split('?')[0];
        l.href = `${u}?t=${Date.now()}`;
      });
    });
  </script>
</head>
<body>
  <!-- Decap CMS Core Engine -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // Register Master Stylesheet for live preview rendering
    CMS.registerPreviewStyle('../styles.css');

    // Custom Live Luxury Showcase Preview for Service Providers & Dominants
    const DirectoryPreview = createClass({
      render: function() {
        const entry = this.props.entry;
        const id = entry.getIn(['data', 'id']) || 'alek-zane';
        const name = entry.getIn(['data', 'name']) || 'Provider Name';
        const role = entry.getIn(['data', 'role']) || 'Financial Domme & Luxury Companion';
        const roleType = (entry.getIn(['data', 'role_type']) || 'domme').toUpperCase();
        const startingRate = entry.getIn(['data', 'starting_rate']) || 'L$3,000 / hr';
        const status = entry.getIn(['data', 'status']) || 'Available';
        const tagline = entry.getIn(['data', 'tagline']) || 'Unapologetic luxury, exquisite psychological draining...';
        const location = entry.getIn(['data', 'location']) || 'Control & Chaos VIP Lounge';
        const slUsername = entry.getIn(['data', 'sl_username']) || 'resident.name';
        const aboutTitle = entry.getIn(['data', 'about_title']) || 'About & Philosophy';
        const about = entry.getIn(['data', 'about']) || '';

        const rawAvatar = entry.getIn(['data', 'avatar_image']);
        const avatarImg = rawAvatar ? this.props.getAsset(rawAvatar).toString() : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80';

        const rawBanner = entry.getIn(['data', 'banner_image']);
        const bannerImg = rawBanner ? this.props.getAsset(rawBanner).toString() : null;

        const rateCats = entry.getIn(['data', 'rate_categories']);
        const hardware = entry.getIn(['data', 'hardware_compat']);
        const limits = entry.getIn(['data', 'hard_limits']);
        const tags = entry.getIn(['data', 'tags']);

        const roleIcon = roleType === 'DOMME' || roleType === 'DOM' ? '👑' : (roleType === 'SUB' ? '⛓️' : '🎭');
        const isBusy = status.toLowerCase().includes('busy');
        const isAppt = status.toLowerCase().includes('appt');
        const dotColor = isBusy ? '#ef4444' : (isAppt ? '#f59e0b' : '#10b981');

        return h('div', {
          style: {
            padding: '24px 16px',
            background: '#09090d',
            color: '#eaeaf0',
            minHeight: '100vh',
            fontFamily: "'Outfit', 'Plus Jakarta Sans', sans-serif"
          }
        }, [
          // Top Shortcut Bar
          h('div', {
            style: {
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center',
              maxWidth: '680px',
              margin: '0 auto 16px',
              padding: '8px 14px',
              background: '#14121a',
              border: '1px solid rgba(212, 175, 55, 0.25)',
              borderRadius: '8px'
            }
          }, [
            h('span', {
              style: {
                fontFamily: "'JetBrains Mono', monospace",
                fontSize: '11px',
                color: '#d4af37',
                letterSpacing: '1px'
              }
            }, '✨ LIVE DIRECTORY SHOWCASE'),
            h('a', {
              href: `/directory/edit/?uuid=${encodeURIComponent(id)}&token=CC_DIRECTORY_SECRET_2026_GOLD`,
              target: '_blank',
              style: {
                color: '#ffd700',
                fontSize: '11px',
                textDecoration: 'none',
                fontWeight: '700',
                padding: '4px 10px',
                background: 'rgba(212,175,55,0.15)',
                border: '1px solid rgba(212,175,55,0.3)',
                borderRadius: '6px'
              }
            }, '🚀 Open in Standalone Editor ↗')
          ]),

          // Showcase Card Container
          h('div', {
            className: 'card',
            style: {
              background: '#110f14',
              border: '1px solid rgba(212, 175, 55, 0.35)',
              borderRadius: '16px',
              overflow: 'hidden',
              maxWidth: '680px',
              margin: '0 auto',
              boxShadow: '0 20px 50px rgba(0, 0, 0, 0.8)'
            }
          }, [
            // Banner & Avatar
            h('div', {
              style: {
                height: '180px',
                backgroundSize: 'cover',
                backgroundPosition: 'center',
                backgroundColor: '#1a171e',
                backgroundImage: bannerImg ? `url('${bannerImg}')` : 'radial-gradient(ellipse at center, #261f2d 0%, #110e14 100%)',
                position: 'relative'
              }
            }, [
              h('div', {
                style: {
                  position: 'absolute',
                  inset: 0,
                  background: 'linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(17,15,20,0.92) 100%)'
                }
              }),
              h('img', {
                src: avatarImg,
                style: {
                  width: '80px',
                  height: '80px',
                  borderRadius: '50%',
                  border: '3px solid #d4af37',
                  objectFit: 'cover',
                  position: 'absolute',
                  bottom: '-32px',
                  left: '24px',
                  boxShadow: '0 6px 18px rgba(0,0,0,0.8), 0 0 15px rgba(212,175,55,0.3)'
                }
              })
            ]),

            // Body
            h('div', { style: { padding: '44px 24px 24px' } }, [
              // Identity Row
              h('div', {
                style: {
                  display: 'flex',
                  justifyContent: 'space-between',
                  alignItems: 'flex-start',
                  marginBottom: '14px',
                  flexWrap: 'wrap',
                  gap: '8px'
                }
              }, [
                h('div', null, [
                  h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '4px' } }, [
                    h('span', {
                      style: {
                        display: 'inline-block',
                        width: '8px',
                        height: '8px',
                        borderRadius: '50%',
                        background: dotColor,
                        boxShadow: `0 0 8px ${dotColor}`
                      }
                    }),
                    h('span', {
                      style: {
                        background: 'rgba(212, 175, 55, 0.15)',
                        color: '#ffd700',
                        border: '1px solid rgba(212, 175, 55, 0.3)',
                        padding: '2px 8px',
                        borderRadius: '12px',
                        fontSize: '10px',
                        fontWeight: '700'
                      }
                    }, status.toUpperCase()),
                    h('span', { style: { fontSize: '14px' } }, roleIcon)
                  ]),
                  h('h2', {
                    style: {
                      margin: '4px 0 2px',
                      fontSize: '24px',
                      fontWeight: '800',
                      color: '#fff'
                    }
                  }, name),
                  h('div', { style: { color: '#d4af37', fontSize: '13px', fontWeight: '600' } }, role)
                ]),
                h('div', { style: { textAlign: 'right' } }, [
                  h('div', { style: { fontSize: '10px', color: '#a09c95', textTransform: 'uppercase', fontFamily: 'monospace' } }, 'Starting Rate'),
                  h('div', { style: { color: '#ffd700', fontSize: '18px', fontWeight: '800', fontFamily: "'Outfit', sans-serif" } }, startingRate)
                ])
              ]),

              // Tagline Quote
              h('div', {
                style: {
                  padding: '10px 14px',
                  background: 'rgba(212,175,55,0.06)',
                  borderLeft: '3px solid #d4af37',
                  borderRadius: '0 6px 6px 0',
                  marginBottom: '16px'
                }
              }, [
                h('p', { style: { margin: 0, fontSize: '13px', fontStyle: 'italic', color: '#f5edd6' } }, `"${tagline}"`)
              ]),

              // Quick Stats Grid
              h('div', {
                style: {
                  display: 'grid',
                  gridTemplateColumns: '1fr 1fr 1fr',
                  gap: '8px',
                  padding: '12px',
                  background: 'rgba(255,255,255,0.02)',
                  border: '1px solid rgba(255,255,255,0.06)',
                  borderRadius: '8px',
                  marginBottom: '18px'
                }
              }, [
                h('div', null, [
                  h('span', { style: { fontSize: '10px', color: '#888', textTransform: 'uppercase', display: 'block', fontFamily: 'monospace' } }, 'Location'),
                  h('strong', { style: { fontSize: '12px', color: '#fff' } }, location)
                ]),
                h('div', null, [
                  h('span', { style: { fontSize: '10px', color: '#888', textTransform: 'uppercase', display: 'block', fontFamily: 'monospace' } }, 'SL Username'),
                  h('strong', { style: { fontSize: '12px', color: '#ffd700', fontFamily: 'monospace' } }, `@${slUsername}`)
                ]),
                h('div', null, [
                  h('span', { style: { fontSize: '10px', color: '#888', textTransform: 'uppercase', display: 'block', fontFamily: 'monospace' } }, 'Tech Sync'),
                  h('strong', { style: { fontSize: '12px', color: '#10b981' } }, `⚡ ${hardware && hardware.size ? hardware.size : 'Ready'}`)
                ])
              ]),

              // About Section
              about ? h('div', { style: { marginBottom: '18px' } }, [
                h('span', { style: { fontSize: '11px', color: '#d4af37', textTransform: 'uppercase', fontWeight: '700', letterSpacing: '1px', display: 'block', marginBottom: '6px' } }, aboutTitle),
                h('p', { style: { fontSize: '13px', color: '#b0b0c5', lineHeight: '1.6', margin: 0, whiteSpace: 'pre-line' } }, about)
              ]) : null,

              // Rate Categories & Services
              rateCats && rateCats.size > 0 ? h('div', { style: { marginBottom: '18px' } }, [
                h('span', { style: { fontSize: '11px', color: '#d4af37', textTransform: 'uppercase', fontWeight: '700', letterSpacing: '1px', display: 'block', marginBottom: '8px' } }, '🪙 Rate Card & Services Menu'),
                (rateCats.toJS ? rateCats.toJS() : rateCats).map((cat, ci) => h('div', {
                  key: ci,
                  style: { marginBottom: '12px', background: 'rgba(255,255,255,0.02)', padding: '12px', borderRadius: '8px', border: '1px solid rgba(212,175,55,0.2)' }
                }, [
                  h('strong', { style: { color: '#ffd700', fontSize: '13px', display: 'block', marginBottom: '6px' } }, cat.category_name || 'Services'),
                  (cat.services || []).map((srv, si) => h('div', {
                    key: si,
                    style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 0', borderBottom: '1px solid rgba(255,255,255,0.05)', fontSize: '12px' }
                  }, [
                    h('span', { style: { color: '#fff' } }, srv.name),
                    h('span', { style: { color: '#ffd700', fontFamily: 'monospace', fontWeight: '700' } }, `${srv.price} ${srv.unit ? `(${srv.unit})` : ''}`)
                  ]))
                ]))
              ]) : null,

              // Hardware Compatibility Badges
              hardware && hardware.size > 0 ? h('div', { style: { marginBottom: '16px' } }, [
                h('span', { style: { fontSize: '11px', color: '#d4af37', textTransform: 'uppercase', fontWeight: '700', letterSpacing: '1px', display: 'block', marginBottom: '6px' } }, '⚡ Hardware Compatibility'),
                h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '6px' } },
                  (hardware.toJS ? hardware.toJS() : hardware).map((hItem, hi) => h('span', {
                    key: hi,
                    style: { background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(212,175,55,0.3)', padding: '3px 8px', borderRadius: '6px', fontSize: '11px', color: '#fff' }
                  }, `${hItem.icon || '⚡'} ${hItem.name} [${hItem.badge_text || 'Ready'}]`))
                )
              ]) : null,

              // Hard Limits
              limits && limits.size > 0 ? h('div', {
                style: {
                  marginBottom: '16px',
                  padding: '12px',
                  background: 'rgba(139,30,45,0.15)',
                  border: '1px solid rgba(139,30,45,0.35)',
                  borderRadius: '8px'
                }
              }, [
                h('span', { style: { fontSize: '11px', color: '#ffb8c2', textTransform: 'uppercase', fontWeight: '700', letterSpacing: '1px', display: 'block', marginBottom: '6px' } }, '🚫 Hard Limits & Boundaries'),
                h('ul', { style: { paddingLeft: '16px', margin: 0, fontSize: '12px', color: '#ddd', lineHeight: '1.5' } },
                  (limits.toJS ? limits.toJS() : limits).map((l, li) => h('li', { key: li }, typeof l === 'object' ? l.limit : l))
                )
              ]) : null,

              // Tags
              tags && tags.size > 0 ? h('div', {
                style: {
                  display: 'flex',
                  flexWrap: 'wrap',
                  gap: '6px',
                  borderTop: '1px solid rgba(255,255,255,0.08)',
                  paddingTop: '14px'
                }
              }, (tags.toJS ? tags.toJS() : tags).map((t, ti) => h('span', {
                key: ti,
                style: {
                  background: 'rgba(212,175,55,0.12)',
                  border: '1px solid rgba(212,175,55,0.3)',
                  color: '#ffd700',
                  padding: '2px 8px',
                  borderRadius: '4px',
                  fontSize: '10.5px'
                }
              }, typeof t === 'object' ? t.tag : t))) : null

            ])
          ])
        ]);
      }
    });

    CMS.registerPreviewTemplate('directory', DirectoryPreview);

    // Custom Live Preview for Blog Posts
    const BlogPreview = createClass({
      render: function() {
        const entry = this.props.entry;
        const title = entry.getIn(['data', 'title']) || 'Article Title';
        const category = entry.getIn(['data', 'category']) || 'Product Launch';
        const author = entry.getIn(['data', 'author']) || 'Architect of Chaos';
        const date = entry.getIn(['data', 'date']) || 'October 2026';
        const summary = entry.getIn(['data', 'summary']) || 'Article summary text...';
        const content = this.props.widgetFor('content');

        const rawImg = entry.getIn(['data', 'featured_image']);
        const featuredImg = rawImg ? this.props.getAsset(rawImg).toString() : null;

        return h('div', {
          style: {
            padding: '30px',
            background: '#09090d',
            color: '#eaeaf0',
            minHeight: '100vh',
            fontFamily: "'Outfit', sans-serif"
          }
        }, [
          h('div', {
            style: {
              maxWidth: '650px',
              margin: '0 auto',
              background: '#121218',
              border: '1px solid rgba(212, 175, 55, 0.3)',
              borderRadius: '16px',
              padding: '30px',
              boxShadow: '0 12px 40px rgba(0,0,0,0.6)'
            }
          }, [
            featuredImg ? h('img', {
              src: featuredImg,
              style: { width: '100%', height: '240px', objectFit: 'cover', borderRadius: '12px', marginBottom: '20px', border: '1px solid rgba(212,175,55,0.25)' }
            }) : null,
            h('div', { style: { color: '#d4af37', fontSize: '12px', marginBottom: '8px' } }, `${date} • ${category} • By ${author}`),
            h('h1', { style: { color: '#fff', fontSize: '26px', margin: '0 0 14px' } }, title),
            h('p', { style: { color: '#b0b0c5', fontSize: '15px', fontStyle: 'italic', marginBottom: '20px' } }, summary),
            h('div', { style: { borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: '20px', lineHeight: '1.7', color: '#e0e0ea' } }, content)
          ])
        ]);
      }
    });

    CMS.registerPreviewTemplate('blog', BlogPreview);

    // Custom Live Preview for Sim Events
    const EventPreview = createClass({
      render: function() {
        const entry = this.props.entry;
        const title = entry.getIn(['data', 'title']) || 'Event Title';
        const categoryTag = (entry.getIn(['data', 'category_tag']) || 'SIM EVENT').toUpperCase();
        const dateDisplay = entry.getIn(['data', 'date_display']) || 'Every Saturday • 1:00 PM SLT';
        const location = entry.getIn(['data', 'location']) || 'Control & Chaos Arena';
        const description = entry.getIn(['data', 'description']) || 'Event description and rules...';

        return h('div', {
          style: {
            padding: '30px 20px',
            background: '#09090d',
            color: '#eaeaf0',
            minHeight: '100vh',
            fontFamily: "'Outfit', 'Plus Jakarta Sans', sans-serif"
          }
        }, [
          h('div', {
            style: {
              textAlign: 'center',
              marginBottom: '20px',
              fontFamily: "'JetBrains Mono', monospace",
              fontSize: '11px',
              color: '#d4af37',
              letterSpacing: '2px'
            }
          }, 'LIVE EVENT CARD PREVIEW'),

          // Card Container
          h('div', {
            className: 'card',
            style: {
              background: 'rgba(18, 18, 24, 0.95)',
              border: '1px solid rgba(212, 175, 55, 0.35)',
              borderRadius: '16px',
              padding: '24px',
              maxWidth: '420px',
              margin: '0 auto',
              boxShadow: '0 12px 40px rgba(0, 0, 0, 0.7)',
              display: 'flex',
              flexDirection: 'column'
            }
          }, [
            // Top Row
            h('div', {
              style: {
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'flex-start',
                marginBottom: '12px',
                gap: '8px'
              }
            }, [
              h('span', {
                style: {
                  background: 'rgba(212, 175, 55, 0.15)',
                  color: '#ffd700',
                  border: '1px solid rgba(212, 175, 55, 0.3)',
                  padding: '3px 10px',
                  borderRadius: '20px',
                  fontSize: '10px',
                  fontWeight: '700',
                  letterSpacing: '1px'
                }
              }, categoryTag),
              h('span', {
                style: {
                  fontFamily: "'JetBrains Mono', monospace",
                  fontSize: '12px',
                  color: '#ffd700'
                }
              }, dateDisplay)
            ]),

            // Title
            h('h3', {
              style: {
                fontSize: '20px',
                color: '#fff',
                fontWeight: '700',
                margin: '0 0 10px'
              }
            }, title),

            // Location
            h('div', {
              style: {
                fontSize: '12px',
                color: '#d4af37',
                marginBottom: '14px',
                display: 'flex',
                alignItems: 'center',
                gap: '6px'
              }
            }, `📍 ${location}`),

            // Description
            h('p', {
              style: {
                fontSize: '13.5px',
                lineHeight: '1.6',
                color: '#b0b0c5',
                marginBottom: '20px',
                flex: '1'
              }
            }, description),

            // Action Buttons
            h('div', {
              style: {
                borderTop: '1px solid rgba(255, 255, 255, 0.08)',
                paddingTop: '16px',
                marginTop: 'auto',
                display: 'flex',
                gap: '10px',
                flexWrap: 'wrap'
              }
            }, [
              h('button', {
                style: {
                  background: 'linear-gradient(135deg, #d4af37 0%, #997c22 100%)',
                  color: '#09090d',
                  border: 'none',
                  padding: '9px 16px',
                  borderRadius: '8px',
                  fontWeight: '700',
                  fontSize: '11px',
